name: Refresh public market snapshot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: PYTHONPATH=src python -m monitor --seconds 20
      - name: Save dashboard and history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/index.html data/history.json data/latest.json
          git diff --cached --quiet || (git commit -m 'Refresh public market snapshot' && git push)
