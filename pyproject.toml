[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-market-monitor"
version = "0.1.0"
description = "Paper-only public crypto market monitor"
requires-python = ">=3.11"
dependencies = ["certifi>=2024", "websocket-client>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["monitor"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
